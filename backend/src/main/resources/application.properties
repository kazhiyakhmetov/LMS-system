spring.application.name=EducationSystem
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/EducationSystem}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
server.address=0.0.0.0

spring.main.allow-circular-references=true
logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
debug=true
server.port = 8080

# ????????? ???????? ??????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=uploads

# ????????? CORS ??? ??????
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

spring.jackson.serialization.fail-on-empty-beans=false

# AI service (FastAPI) — see docker-compose `ai` service
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}
ai.service.connect-timeout-ms=2000
ai.service.read-timeout-ms=5000

# === JWT ===
# Секрет должен быть >=32 байт (256 бит) для HS256. В проде задавать через env JWT_SECRET.
jwt.secret=${JWT_SECRET}
# Срок жизни access-токена в миллисекундах: 12 часов
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
jwt.issuer=studix
