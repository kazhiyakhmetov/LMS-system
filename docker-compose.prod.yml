# Production compose for a small (2 GB RAM) server.
# Differences vs docker-compose.yml:
#   - No Ollama / LLM (quiz generation is shown pre-generated from the DB).
#   - Only the frontend is published (port 80). DB / Redis / backend / AI stay
#     on the internal network — not reachable from the public internet.
#   - Backend JVM heap is capped so everything fits in 2 GB.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    container_name: studix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-EducationSystem}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-EducationSystem}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - studix

  redis:
    image: redis:7-alpine
    container_name: studix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - studix

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: studix-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-EducationSystem}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RISK_MODEL_PATH: /app/models/risk_v1.joblib
    volumes:
      - ai_models:/app/models
    networks:
      - studix

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-EducationSystem}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-43200000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      FILE_UPLOAD_DIR: /app/uploads
      AI_SERVICE_URL: http://ai:8000
      # Cap the JVM so the whole stack fits in 2 GB RAM.
      JAVA_OPTS: "-Xmx640m -Xss512k"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - studix

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: studix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - studix

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  ai_models:

networks:
  studix:
    driver: bridge
